<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="32" fill="#F0FDF4" />
  <!-- Glass sheet -->
  <rect x="60" y="32" width="80" height="136" rx="14" fill="#E2E8F0" stroke="#10B981" stroke-width="3" opacity="0.9" />
  <rect x="68" y="40" width="64" height="120" rx="10" fill="#F8FAFC" />
  <!-- Diagonal glass sheen sparkle -->
  <line x1="68" y1="90" x2="120" y2="40" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <line x1="78" y1="110" x2="132" y2="55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <!-- 9H diamond badge -->
  <circle cx="100" cy="115" r="16" fill="#10B981" />
  <text x="100" y="120" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">9H</text>
</svg>
